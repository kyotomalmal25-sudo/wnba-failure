<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #fbfaf7; }
    a { color: #1fa083; text-decoration: none; }
  </style>
</helmet>

<div style="width: 1440px; background: #fbfaf7; font-family: 'IBM Plex Sans JP', 'DM Sans', system-ui, sans-serif; color: #373431;">

  <!-- nav：柔らかい、SaaS的な軽さ -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 72px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #3ed6c7, #1fa083);"></div>
      <span style="font-family: 'DM Sans', sans-serif; font-size: 17px; font-weight: 700; color: #101010;">WNBA Japan</span>
    </div>
    <div style="display: flex; gap: 32px; font-size: 13px; color: #6d6861; font-weight: 500;">
      <span>はじめる</span><span>選手</span><span>チーム</span><span>日本人選手</span><span>深く読む</span>
    </div>
    <div style="padding: 11px 22px; border-radius: 100px; background: #101010; color: #fff; font-size: 13px; font-weight: 600;">読みはじめる</div>
  </div>

  <!-- hero：グラデーション背景の丸いカード、ソフトな影 -->
  <div style="margin: 20px 72px 0; padding: 96px 80px; border-radius: 32px; background: linear-gradient(135deg, #eafaf6 0%, #f4f1eb 55%, #fbfaf7 100%); position: relative; overflow: hidden;">
    <div style="position: absolute; right: -60px; top: -60px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(62,214,199,.35), transparent 70%);"></div>
    <div style="position: relative; max-width: 640px;">
      <div style="display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 100px; background: #fff; box-shadow: 0 4px 14px rgba(16,16,16,.06); font-size: 11px; font-weight: 600; color: #1fa083; margin-bottom: 30px;">● 2026シーズン開幕中</div>
      <div style="font-family: 'DM Sans', sans-serif; font-size: 60px; font-weight: 700; line-height: 1.18; color: #101010; letter-spacing: -.02em;">
        WNBAを、<br>やさしく読みはじめる。
      </div>
      <div style="font-size: 15px; line-height: 1.9; color: #6d6861; margin-top: 28px; max-width: 480px;">
        NBAは知っている。WNBAはまだ。8本の記事で、その距離を埋めます。
      </div>
      <div style="display: flex; gap: 14px; margin-top: 38px;">
        <div style="padding: 15px 28px; border-radius: 100px; background: linear-gradient(135deg, #3ed6c7, #1fa083); color: #fff; font-size: 14px; font-weight: 600;">超入門から読む →</div>
        <div style="padding: 15px 28px; border-radius: 100px; background: #fff; box-shadow: 0 4px 14px rgba(16,16,16,.06); color: #373431; font-size: 14px; font-weight: 600;">全8本を見る</div>
      </div>
    </div>
  </div>

  <!-- 丸角カードグリッド：柔らかい影、写真は角丸で -->
  <div style="padding: 88px 72px;">
    <div style="text-align: center; margin-bottom: 52px;">
      <div style="font-size: 12px; font-weight: 600; color: #1fa083; letter-spacing: .1em; margin-bottom: 14px;">START HERE</div>
      <div style="font-family: 'DM Sans', sans-serif; font-size: 32px; font-weight: 700; color: #101010;">最初に読みたい3本</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;">
      <div style="background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(16,16,16,.06);">
        <img src="feature-crossover.webp" style="width: 100%; height: 190px; object-fit: cover; display: block;">
        <div style="padding: 26px;">
          <div style="display: inline-block; padding: 5px 12px; border-radius: 100px; background: #eafaf6; color: #1fa083; font-size: 10px; font-weight: 700; margin-bottom: 14px;">01 入門</div>
          <div style="font-size: 17px; font-weight: 700; color: #101010; line-height: 1.5;">WNBA超入門</div>
          <div style="font-size: 12px; color: #6d6861; margin-top: 10px; line-height: 1.7;">40分制と3Pラインの違いを5分で。</div>
        </div>
      </div>
      <div style="background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(16,16,16,.06);">
        <img src="japan-challenger.webp" style="width: 100%; height: 190px; object-fit: cover; display: block;">
        <div style="padding: 26px;">
          <div style="display: inline-block; padding: 5px 12px; border-radius: 100px; background: #eafaf6; color: #1fa083; font-size: 10px; font-weight: 700; margin-bottom: 14px;">05 入門</div>
          <div style="font-size: 17px; font-weight: 700; color: #101010; line-height: 1.5;">日本人挑戦者ウォッチ</div>
          <div style="font-size: 12px; color: #6d6861; margin-top: 10px; line-height: 1.7;">歴代5人と2026年の現在地。</div>
        </div>
      </div>
      <div style="background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(16,16,16,.06);">
        <img src="hero-arena.webp" style="width: 100%; height: 190px; object-fit: cover; display: block;">
        <div style="padding: 26px;">
          <div style="display: inline-block; padding: 5px 12px; border-radius: 100px; background: #fdece5; color: #f05a36; font-size: 10px; font-weight: 700; margin-bottom: 14px;">04 入門</div>
          <div style="font-size: 17px; font-weight: 700; color: #101010; line-height: 1.5;">全15チーム勢力図</div>
          <div style="font-size: 12px; color: #6d6861; margin-top: 10px; line-height: 1.7;">推しチーム診断つき早見表。</div>
        </div>
      </div>
    </div>
  </div>

  <div style="margin: 0 72px 40px; padding: 30px 40px; border-radius: 24px; background: #101010; color: #fbfaf7; display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
    <span style="opacity: .7;">EDITORIAL: Claude · GPT · Gemini</span>
    <span style="opacity: .5;">© 2026 WNBA Japan</span>
  </div>

</div>
</x-dc>
</body>
</html>
